<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#182018">
<title>OUTLAND — Verda</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#182018;color:#eee;font:16px system-ui;overscroll-behavior:none}
#canvas{display:block;width:100%!important;height:100%!important;touch-action:none;outline:none}
#gate{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#182018;z-index:3;text-align:center;padding:24px}
button{padding:14px 24px;font:inherit;background:#b9ca8b;border:0;border-radius:6px;color:#182018}
#start:disabled{opacity:.5}#tools{position:fixed;right:env(safe-area-inset-right,8px);top:env(safe-area-inset-top,8px);z-index:2}
#tools button{padding:6px 10px;font-size:12px}#warning{position:fixed;bottom:8px;left:8px;right:8px;background:#532;padding:8px;display:none;z-index:4}
#rotate{display:none;position:fixed;inset:0;background:#182018;z-index:5;align-items:center;justify-content:center;text-align:center}
@media(orientation:portrait){#rotate{display:flex}}
</style></head><body>
<canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
<div id="gate"><h1>OUTLAND</h1><p>Enter Verda. Use both sticks and the action buttons.</p><p id="status">Downloading production assets…</p><button id="start" disabled>PLAY</button><p>First load downloads the full world. Return Home to save before closing.</p></div>
<div id="tools"><button id="fullscreen">Full screen</button></div><div id="warning" role="status"></div>
<div id="rotate">Rotate your phone to landscape.<br>On iPhone, Add to Home Screen for more room.</div>
<script>
var Module = {
 canvas:document.getElementById('canvas'),
 setStatus:function(text){document.getElementById('status').textContent=text;},
 outlandStorageWarning:function(text){const box=document.getElementById('warning');box.textContent=text;box.style.display='block';},
 onRuntimeInitialized:function(){document.getElementById('status').textContent='Ready';document.getElementById('start').disabled=false;},
 onAbort:function(reason){Module.outlandStorageWarning('Unable to start OUTLAND: '+reason);}
};
function resumeAudio(){
 const devices=window.miniaudio && window.miniaudio.devices;
 if(devices) for(const device of devices) if(device && device.webaudio) device.webaudio.resume().catch(()=>{});
}
document.getElementById('start').addEventListener('click',function(){
 document.getElementById('gate').style.display='none';Module.canvas.focus();Module.callMain([]);resumeAudio();
});
Module.canvas.addEventListener('touchstart',resumeAudio,{passive:true});Module.canvas.addEventListener('mousedown',resumeAudio);
document.getElementById('fullscreen').addEventListener('click',async function(){
 try{if(Module.canvas.requestFullscreen)await Module.canvas.requestFullscreen();else Module.outlandStorageWarning('Safari uses landscape browser mode. Add to Home Screen to hide browser chrome.');
 if(screen.orientation && screen.orientation.lock)await screen.orientation.lock('landscape');}catch(e){/* Safari landscape remains usable without fullscreen. */}
});
</script>
{{{ SCRIPT }}}
</body></html>
